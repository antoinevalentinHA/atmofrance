name: Tests

on:
  push:
  pull_request:
  # requirements_test.txt n'est pas epingle : la suite suit donc la derniere
  # version de Home Assistant. Sans declenchement periodique, une depreciation
  # HA ne serait decouverte qu'au prochain push - c'est-a-dire potentiellement
  # apres qu'elle a casse l'integration en production.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
      - name: Run tests
        run: pytest -q
